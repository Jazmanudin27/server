# Nginx Reverse Proxy Config for Custom Domain (e.g. ssh.domainanda.com)
# Place this in /etc/nginx/sites-available/termius on your VPS

server {
    listen 80;
    server_name ssh.domainanda.com; # Replace with your real domain

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket headers essential for real-time SSH terminal stream & SFTP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable timeout for long-lived SSH sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
